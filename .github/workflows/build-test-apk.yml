name: Build Test APK (Kikoeta300)

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix script permissions
        run: chmod -R +x app/rust_builder/cargokit/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Customize App ID & Name for Testing (Prevent Conflict)
        run: |
          echo "Renaming applicationId to kikoeta.chenflxs.kikoeta300 and label to Kikoeta300..."
          sed -i 's/applicationId = "kikoeta.chenflxs"/applicationId = "kikoeta.chenflxs.kikoeta300"/' app/android/app/build.gradle.kts
          sed -i 's/android:label="Kikoeta"/android:label="Kikoeta300"/' app/android/app/src/main/AndroidManifest.xml
          # Remove Aliyun mirrors in CI to prevent 502 Bad Gateway on overseas runners
          sed -i '/maven.aliyun.com/d' app/android/build.gradle.kts app/android/settings.gradle.kts

      - name: Configure Fixed Test Keystore
        run: |
          echo "Setting up fixed signing key for Kikoeta300..."
          echo "" | base64 -d > app/android/kikoeta300-release.jks
          cat << 'EOF' > app/android/key.properties
          storePassword=kikoeta300password
          keyPassword=kikoeta300password
          keyAlias=kikoeta300
          storeFile=kikoeta300-release.jks
          EOF
          keytool -list -v -keystore app/android/kikoeta300-release.jks -storepass kikoeta300password

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (arm64-v8a)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 --verbose
          mkdir -p ../dist
          find build/app/outputs -name "*.apk" -exec cp {} ../dist/kikoeta300-arm64-v8a-release.apk \;

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kikoeta300-arm64-v8a-release
          path: dist/kikoeta300-arm64-v8a-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release --verbose

      - name: Archive Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/kikoeta300-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kikoeta300-windows-x64
          path: dist/kikoeta300-windows-x64.zip
          if-no-files-found: error
